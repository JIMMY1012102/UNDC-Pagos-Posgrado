name: Preparar Spatie (temporal)
on:
  push:
    branches: [feat/spatie-roles-permisos-v1]
    paths: ['.github/workflows/prepare-spatie.yml']
permissions:
  contents: write
jobs:
  resolver-dependencias:
    if: github.repository == 'JIMMY1012102/UNDC-Pagos-Posgrado'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, curl, fileinfo, pdo_mysql, sqlite3, pdo_sqlite, zip
          coverage: none
          tools: composer:v2
      - name: Instalar Spatie y generar lock reproducible
        run: |
          composer require 'spatie/laravel-permission:^8.3' --no-interaction --prefer-dist --no-progress
          php artisan vendor:publish --provider="Spatie\\Permission\\PermissionServiceProvider" --no-interaction
          composer validate --strict
      - name: Registrar archivos oficiales en la rama de trabajo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.json composer.lock config/permission.php database/migrations
          git diff --cached --exit-code && exit 0
          git commit -m "build(auth): install Spatie Permission v8 and publish official schema"
          git push origin HEAD:refs/heads/feat/spatie-roles-permisos-v1
