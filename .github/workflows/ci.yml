name: CI · Laravel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/base-datos-escalable-v1, feat/backend-catalogo-v1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  laravel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar PHP 8.3 (igual que Oracle)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, curl, fileinfo, pdo_mysql, sqlite3, pdo_sqlite, zip
          coverage: none
          tools: composer:v2

      - name: Validar Composer
        run: composer validate --strict

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar entorno de pruebas
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Ejecutar pruebas Laravel
        run: php artisan test --no-ansi

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Compilar frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  maria-db-compartida:
    name: Integración real SISPAGOS + tienda (MariaDB)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci_only_password
          MARIADB_DATABASE: undc_tesoreria_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: undc_tesoreria_ci
      DB_USERNAME: root
      DB_PASSWORD: ci_only_password
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar PHP 8.3 con MariaDB
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, curl, fileinfo, pdo_mysql, zip
          coverage: none
          tools: composer:v2

      - name: Instalar dependencias y configuración de prueba
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate

      - name: Crear solo las seis tablas originales vacías de SISPAGOS
        run: php tests/Fixtures/mariadb_check.php setup

      - name: Verificar compatibilidad original
        run: php artisan treasury:schema-check

      - name: Aplicar migraciones de tienda en base compartida de prueba
        run: php artisan migrate --force

      - name: Comprobar llaves foráneas reales y uniones de catálogo
        run: php tests/Fixtures/mariadb_check.php verify
