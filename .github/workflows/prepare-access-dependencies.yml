name: Preparar dependencias Acceso
on:
  push:
    branches: [feat/acceso-spatie-google-oauth]
    paths:
      - '.github/workflows/prepare-access-dependencies.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bootstrap:
    if: github.ref == 'refs/heads/feat/acceso-spatie-google-oauth'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, curl, fileinfo, pdo_mysql, sqlite3, pdo_sqlite, zip
          tools: composer:v2
      - name: Instalar dependencias versionadas
        run: composer require 'spatie/laravel-permission:^8.0' 'laravel/socialite:^5.0' --no-interaction --no-progress
      - name: Publicar config y migracion de Spatie
        run: php artisan vendor:publish --provider='Spatie\Permission\PermissionServiceProvider' --force
      - name: Validar consistencia
        run: |
          composer validate --strict
          php artisan migrate --pretend --no-ansi
      - name: Registrar archivos realmente generados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.json composer.lock config/permission.php database/migrations/
          git diff --cached --exit-code || git commit -m 'build(acceso): instalar Spatie y Socialite con lock real'
          git push origin HEAD:feat/acceso-spatie-google-oauth
