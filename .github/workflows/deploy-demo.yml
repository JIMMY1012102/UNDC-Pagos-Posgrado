name: Desplegar demo en Oracle Cloud (manual)

# Activaremos push a main después de validar el primer despliegue.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-undc-demo
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, curl, fileinfo, pdo_mysql, sqlite3, pdo_sqlite, zip
          coverage: none
          tools: composer:v2
      - name: Instalar dependencias y ejecutar pruebas
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          php artisan test --no-ansi

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Descargar versión de main
        uses: actions/checkout@v4

      - name: Preparar PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, curl, fileinfo, pdo_mysql, sqlite3, pdo_sqlite, zip
          coverage: none
          tools: composer:v2

      - name: Instalar PHP de producción en el runner
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Compilar recursos de frontend en GitHub
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Preparar SSH con host verificado
        env:
          PRIVATE_KEY: ${{ secrets.ORACLE_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_KEY"
          test -n "$KNOWN_HOSTS"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null

      - name: Publicar únicamente el proyecto UNDC-Pagos
        env:
          SSH_TARGET: undcdeploy@163.176.230.238
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes "$SSH_TARGET" 'test -f /var/www/undc-pagos/.env && test -d /var/www/undc-pagos/storage'
          rsync -rltz --delete \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.env' \
            --exclude='/storage/' \
            --exclude='/database/database.sqlite' \
            --exclude='/node_modules/' \
            --exclude='/tests/' \
            --exclude='/public/index.html' \
            -e 'ssh -o BatchMode=yes' \
            ./ "$SSH_TARGET:/var/www/undc-pagos/"
          ssh -o BatchMode=yes "$SSH_TARGET" '
            set -eu
            cd /var/www/undc-pagos
            rm -f public/index.html public/hot
            php artisan optimize:clear --no-ansi
            php artisan config:cache --no-ansi
            curl -fsS -H "Host: undc-pagos.163-176-230-238.sslip.io" http://127.0.0.1/ >/dev/null
            echo "Demo UNDC-Pagos desplegada; respuesta HTTP correcta"
          '
