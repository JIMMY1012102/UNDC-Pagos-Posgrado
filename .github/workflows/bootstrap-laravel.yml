name: Preparar Laravel 13 (una sola vez)

on:
  push:
    paths:
      - '.github/workflows/bootstrap-laravel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Revisar si Laravel ya está instalado
        id: check
        run: |
          if [ -f artisan ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: shivammathur/setup-php@v2
        if: steps.check.outputs.exists == 'false'
        with:
          php-version: '8.3'
          extensions: mbstring, dom, curl, fileinfo, pdo_mysql, sqlite3, pdo_sqlite, zip
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'false'
        with:
          node-version: '22'

      - name: Crear Laravel y preservar README
        if: steps.check.outputs.exists == 'false'
        run: |
          set -euo pipefail
          composer create-project laravel/laravel /tmp/undc-laravel '^13.0' --no-install --no-scripts --no-interaction
          composer config --working-dir=/tmp/undc-laravel platform.php 8.3.6
          rsync -a --exclude=.git --exclude=README.md --exclude=.env \
            /tmp/undc-laravel/ "$GITHUB_WORKSPACE/"
          composer install --no-interaction --prefer-dist --no-progress
          npm install --no-audit --no-fund
          npm run build

      - name: Probar aplicación Laravel
        if: steps.check.outputs.exists == 'false'
        run: |
          set -euo pipefail
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force
          php artisan test

      - name: Subir el proyecto generado a main
        if: steps.check.outputs.exists == 'false'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: inicializa aplicación Laravel 13 con dependencias fijadas"
          git push origin HEAD:main
